name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Testcontainers starts isolated PostgreSQL 17 and Mailpit containers.
      - name: Run unit and integration tests
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
      - name: Build backend Docker image
        run: docker build --tag tireshop-backend:ci .

  frontend:
    name: Frontend tests, build and Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watch=false
      - name: Build Angular
        run: npm run build
      - name: Build frontend Docker image
        run: docker build --tag tireshop-frontend:ci .
