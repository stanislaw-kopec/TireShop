log_format tireshop '$request_method $uri $status $request_time';

server {
    access_log /var/log/nginx/access.log tireshop;
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
