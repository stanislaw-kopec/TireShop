<header>
  <a routerLink="/" aria-label="TireShop — katalog opon">
    <img src="/wheel.svg" alt="" width="36" height="36">
    TireShop
  </a>
  <nav aria-label="Zakupy i konto">
    @if (!auth.staff()) { <a routerLink="/koszyk">Koszyk @if (cart.count() !== undefined) { ({{ cart.count() }}) }</a> }
    @if (auth.profile()) {
      @if (auth.staff()) { <a routerLink="/personel">Panel personelu</a> }
      @else { <a routerLink="/konto">Moje konto</a> }
      <button type="button" (click)="logout()" [disabled]="loggingOut() || cart.busy()">Wyloguj się</button>
    } @else {
      <a routerLink="/logowanie">Zaloguj się</a>
    }
  </nav>
</header>
@if (auth.notice()) { <p role="status">{{ auth.notice() }}</p> }
<main><router-outlet /></main>
<footer><a routerLink="/track-order">Śledzenie zamówienia gościa</a></footer>
