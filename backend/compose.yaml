name: tireshop
services:
  mailpit:
    image: axllent/mailpit:v1.31.4
    labels:
      org.springframework.boot.ignore: 'true'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tireshop
      POSTGRES_USER: tireshop
      POSTGRES_PASSWORD: tireshop_local
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tireshop -d tireshop']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
