spring.application.name=tireshop
spring.profiles.default=local
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/tireshop}
spring.datasource.username=${DB_USERNAME:tireshop}
spring.datasource.password=${DB_PASSWORD:tireshop_local}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.docker.compose.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
spring.jackson.deserialization.fail-on-unknown-properties=true
app.security.absolute-session-timeout=8h
app.security.cookie-secure=${SESSION_COOKIE_SECURE:true}
app.account.password-link-url=${PASSWORD_LINK_URL:http://localhost:4200/set-password}
app.account.mail-from=${MAIL_FROM:no-reply@tireshop.local}
app.account.invitation-ttl=24h
app.account.password-reset-ttl=30m
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
springdoc.swagger-ui.csrf.enabled=true
